spring.application.name=inventory

server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory_user
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- Observability ---------------------------------------------------------
# Probes are only auto-enabled on Kubernetes; enable them explicitly so
# /actuator/health/readiness exists under Docker Compose too.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# --- Security (override in every real environment) -------------------------
# X-API-Key for /api/**; HMAC secret for the payment webhook endpoints.
inventory.security.api-key=${INVENTORY_API_KEY:dev-api-key-change-me}
inventory.security.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret-change-me}
inventory.security.webhook-tolerance-seconds=300

inventory.order-expiry-delay-ms=30000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

inventory.cache.product-ttl-minutes=10

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=inventory-notifications
spring.kafka.consumer.auto-offset-reset=earliest
inventory.outbox-poll-ms=1000
inventory.outbox-batch-size=100
inventory.outbox-retention-days=7
